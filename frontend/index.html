<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UDERP — Organizational Control Center v1.11</title>
<style>
:root{--bg:#050914;--panel:#0a1324;--panel2:#0d1930;--line:#1a3152;--line2:#26466e;--text:#e9f0fb;--muted:#7f91ad;--blue:#5b9cff;--cyan:#3bd9d0;--green:#45d49a;--amber:#e8b94e;--red:#ff5d69;--violet:#9b82ff;--shadow:0 18px 55px rgba(0,0,0,.35)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#040812;color:var(--text);font:13px Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit}.app{min-height:100vh;display:grid;grid-template-columns:224px minmax(0,1fr);align-items:stretch}.side{height:100vh;position:sticky;top:0;overflow:hidden;display:flex;flex-direction:column;min-height:0;border-right:1px solid #142844;background:linear-gradient(180deg,#06101f 0%,#040a15 100%);padding:22px 12px}.brand{padding:0 12px 20px;border-bottom:1px solid #132641}.brand strong{display:block;font-size:23px;letter-spacing:5px}.brand small{display:block;color:#7f90aa;font-size:9px;letter-spacing:.65px;line-height:1.5;margin-top:5px}.nav{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:17px 0;display:grid;align-content:start;gap:4px;scrollbar-width:thin}.nav button{border:0;background:transparent;border-radius:9px;padding:10px 12px;display:flex;align-items:center;gap:11px;color:#9cadc6;text-align:left}.nav button:hover{background:#0c1a30;color:#fff}.nav button.active{background:linear-gradient(90deg,#123d82,#0d284f);color:#fff;box-shadow:inset 3px 0 var(--blue)}.nav .ico{width:18px;text-align:center;color:#a6b9d3}.badge{margin-left:auto;background:#e74755;color:white;border-radius:999px;padding:2px 7px;font-size:10px}.sidefoot{border-top:1px solid #132641;padding:14px 12px 4px;color:#657892;font-size:10px;line-height:1.6;flex:0 0 auto}.main{width:100%;max-width:none;margin:0;padding:28px 32px 40px;min-width:0;background:radial-gradient(circle at 78% 0,rgba(37,73,142,.22),transparent 32%)}.top{display:flex;align-items:center;gap:12px;margin:0 0 18px}.title{font-size:25px;font-weight:760;letter-spacing:-.4px}.subtitle{color:#8395b0;margin-top:3px}.search{margin-left:auto;width:365px;background:#081326;border:1px solid #29466d;border-radius:10px;padding:10px 13px;color:#e5edf8;outline:0}.search:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(91,156,255,.12)}.topbtn{border:1px solid #2a486f;background:#0b1930;border-radius:9px;padding:10px 13px}.topbtn.primary{background:#1959b7;border-color:#3f83f8}.filters{display:flex;gap:9px;align-items:center;margin-bottom:16px}.select{background:#081326;border:1px solid #29466d;border-radius:9px;color:#e6eef9;padding:10px 12px;min-width:260px}.live{margin-left:auto;color:#66e0aa;display:flex;gap:7px;align-items:center}.live i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(6,minmax(135px,1fr))}.card{background:linear-gradient(180deg,rgba(12,25,48,.96),rgba(7,15,30,.98));border:1px solid #193457;border-radius:13px;box-shadow:var(--shadow)}.kpi{padding:14px 15px;min-height:104px}.label{font-size:10px;color:#8192ad;text-transform:uppercase;letter-spacing:.8px}.value{font-size:25px;font-weight:760;margin:8px 0 4px}.small{font-size:10px}.up{color:var(--green)}.down{color:var(--red)}.warn{color:var(--amber)}.panel{padding:16px}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.paneltitle{font-weight:720;font-size:14px}.muted{color:var(--muted)}.link{border:0;background:transparent;color:#6ca8ff}.bodygrid{grid-template-columns:1.45fr 1fr 1fr}.wide{grid-column:span 2}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.signal{display:grid;grid-template-columns:9px 1fr auto;gap:10px;align-items:start;padding:11px 0;border-bottom:1px solid #182c49}.signal:last-child{border-bottom:0}.sev{width:8px;height:8px;border-radius:50%;margin-top:5px}.critical{background:var(--red);box-shadow:0 0 10px rgba(255,93,105,.5)}.watch{background:var(--amber)}.info{background:var(--blue)}.sigtitle{font-weight:680}.sigmeta{font-size:10px;color:#71839e;margin-top:4px;line-height:1.4}.pill{border:1px solid #385473;border-radius:999px;padding:3px 7px;font-size:9px;color:#9fb1c9;white-space:nowrap}.pill.red{border-color:#74333d;color:#ff9fa7}.pill.amber{border-color:#6c5727;color:#f0cc70}.pill.green{border-color:#28634f;color:#76dfb3}.barrow{display:grid;grid-template-columns:145px 1fr 42px;gap:9px;align-items:center;margin:11px 0}.track{height:7px;background:#182944;border-radius:99px;overflow:hidden}.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#4d8dff,#3bd9d0)}.fill.red{background:linear-gradient(90deg,#d93f51,#ff6871)}.fill.amber{background:linear-gradient(90deg,#c89428,#f0c65f)}.table{width:100%;border-collapse:collapse}.table th{text-align:left;color:#71839f;font-size:10px;font-weight:500;padding:8px;border-bottom:1px solid #203958}.table td{padding:10px 8px;border-bottom:1px solid #172b47}.btn{background:#0e213e;border:1px solid #2a4a76;border-radius:8px;padding:7px 10px}.btn.good{background:#0d3529;border-color:#286a53}.btn.danger{background:#3a1720;border-color:#71323d}.btn:hover{filter:brightness(1.15)}.view{display:none;min-height:0}.view.active{display:block}.chartbox{height:245px}.chartbox svg{width:100%;height:100%}.legend{display:flex;gap:17px;font-size:10px;color:#7e90aa;margin-top:-2px}.legend span:before{content:'';display:inline-block;width:18px;height:2px;background:var(--blue);margin:0 5px 3px 0}.legend .actual:before{background:var(--green)}.legend .forecast:before{background:var(--violet);border-top:2px dashed var(--violet);height:0}.matrix{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.cell{min-height:64px;border:1px solid #1d385d;background:#0a172b;border-radius:8px;padding:8px}.cell b{display:block;font-size:16px;margin-top:6px}.cell.red{border-color:#733440}.cell.amber{border-color:#6b5728}.cell.green{border-color:#28604d}.timeline{border-left:1px solid #284566;margin-left:7px;padding-left:20px}.event{position:relative;padding-bottom:17px}.event:before{content:'';position:absolute;left:-25px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--blue)}.event.resolved:before{background:var(--green)}.event b{font-weight:680}.event small{display:block;color:#71839d;margin-top:4px}.map{height:520px;position:relative;overflow:hidden;border:1px solid #1e3b62;border-radius:12px;background:radial-gradient(circle at 50% 48%,#122c50,#071021 63%,#050a13)}.map svg{position:absolute;inset:0;width:100%;height:100%}.node{position:absolute;transform:translate(-50%,-50%);padding:10px 12px;background:#0c1b31;border:1px solid #35577f;border-radius:9px;min-width:118px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.35)}.node strong{display:block}.node small{display:block;color:#7e90aa;margin-top:3px;font-size:9px}.node.red{border-color:#a5414e;box-shadow:0 0 24px rgba(255,93,105,.16)}.node.amber{border-color:#866b2d}.node.green{border-color:#34755b}.maplegend{position:absolute;left:14px;bottom:14px;display:flex;gap:12px;background:rgba(5,12,23,.82);border:1px solid #203958;border-radius:9px;padding:8px 10px;font-size:10px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:30}.modal.open{display:flex}.modalbox{width:min(820px,92vw);max-height:90vh;overflow:auto;background:#091426;border:1px solid #2b4b75;border-radius:14px;padding:20px;box-shadow:0 35px 120px #000}.modalhead{display:flex;justify-content:space-between;align-items:flex-start}.close{border:0;background:transparent;color:#92a3bd;font-size:22px}.detailgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:15px 0}.detail{background:#0c1c33;border:1px solid #1d395e;border-radius:9px;padding:11px}.detail b{display:block;margin-top:5px;font-size:15px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.toast{position:fixed;right:22px;bottom:22px;display:none;background:#102541;border:1px solid #34567f;border-radius:9px;padding:12px 15px;z-index:40}.toast.show{display:block}.empty{text-align:center;padding:30px;color:#74859f}.scenario{grid-template-columns:repeat(3,1fr)}.scenario .card{padding:14px}.range{width:100%}.insight{border-left:3px solid var(--blue);padding:9px 11px;background:#0b1930;margin:8px 0;border-radius:0 8px 8px 0}.insight.red{border-left-color:var(--red)}.insight.green{border-left-color:var(--green)}
@media(max-width:1180px){.app{grid-template-columns:76px minmax(0,1fr)}.brand{padding-left:4px;padding-right:4px;text-align:center}.brand strong{font-size:17px;letter-spacing:3px}.brand small,.nav span,.sidefoot{display:none}.nav button{justify-content:center}.main{padding:22px 24px 32px}.kpis{grid-template-columns:repeat(3,1fr)}.bodygrid{grid-template-columns:1fr 1fr}.wide{grid-column:auto}}
@media(max-width:760px){.app{display:block;min-height:100vh}.side{height:auto;position:relative;border-right:0;border-bottom:1px solid #162b47;padding:10px}.brand{display:none}.nav{display:flex;padding:0;overflow:auto}.nav button{min-width:max-content}.nav span{display:inline}.main{padding:18px 16px 28px}.top{flex-wrap:wrap}.search{order:5;width:100%;margin-left:0}.filters{flex-wrap:wrap}.live{margin-left:0}.kpis,.bodygrid,.split,.scenario{grid-template-columns:1fr}.detailgrid{grid-template-columns:1fr 1fr}.matrix{grid-template-columns:1fr 1fr}}
</style></head>
<body>
<div class="app">
<aside class="side"><div class="brand"><strong>UDERP</strong><small>UGANDA DEVELOPMENT<br>EXECUTION & RECONCILIATION<br>PLATFORM</small></div>
<nav class="nav" id="nav">
<button class="active" data-view="control"><i class="ico">⌂</i><span>Control Center</span></button><button data-view="analytics"><i class="ico">◫</i><span>Analytics</span></button><button data-view="programmes"><i class="ico">▦</i><span>Programmes</span></button><button data-view="activities"><i class="ico">◌</i><span>Activities</span></button><button data-view="commitments"><i class="ico">✓</i><span>Commitments</span></button><button data-view="evidence"><i class="ico">▤</i><span>Evidence</span></button><button data-view="signals"><i class="ico">⚠</i><span>Signals</span><em class="badge" id="signalBadge">3</em></button><button data-view="partners"><i class="ico">♙</i><span>Partners & Actors</span></button><button data-view="resources"><i class="ico">▤</i><span>Resources</span></button><button data-view="map"><i class="ico">⌘</i><span>Organizational Map</span></button><button data-view="reports"><i class="ico">▥</i><span>Reports</span></button><button data-view="timeline"><i class="ico">◷</i><span>Timeline</span></button></nav>
<div class="sidefoot">From evidence to state.<br>From state to decisions.<br><br><b>UDERP v1.11</b></div></aside>
<main class="main"><div class="top"><div><div class="title" id="pageTitle">Control Center</div><div class="subtitle" id="pageSub">Organizational pulse, current state and management priorities</div></div><input id="search" class="search" placeholder="Search programmes, activities, evidence, signals…  Ctrl K"><button class="topbtn" onclick="compare()">Compare</button><button class="topbtn primary" onclick="go('analytics')">Forecast</button><button class="topbtn" onclick="upload()">＋ Add / Upload</button></div>
<div class="filters"><select class="select"><option>Digital Public Services Programme (DPSP)</option><option>All programmes</option></select><select class="select" style="min-width:180px"><option>Jan 2026 — Dec 2026</option><option>Q3 2026</option></select><div class="live"><i></i> Live organizational state · consistent across views</div></div>
<section id="control" class="view active"></section><section id="analytics" class="view"></section><section id="programmes" class="view"></section><section id="activities" class="view"></section><section id="commitments" class="view"></section><section id="evidence" class="view"></section><section id="signals" class="view"></section><section id="partners" class="view"></section><section id="resources" class="view"></section><section id="map" class="view"></section><section id="reports" class="view"></section><section id="timeline" class="view"></section>
</main></div><div id="modal" class="modal"><div id="modalbox" class="modalbox"></div></div><div id="toast" class="toast"></div>
<script>
const titles={control:['Control Center','Organizational pulse, current state and management priorities'],analytics:['Analytics','Deep quantitative analysis, forecasting and scenario testing'],programmes:['Programmes','Portfolio state and comparative performance'],activities:['Activities','Operational progress, ownership and dependencies'],commitments:['Commitments','Promises, deadlines, completion evidence and aging'],evidence:['Evidence Vault','Source material supporting organizational claims'],signals:['Signal Intelligence','Ranked deviations, gaps and dependency risks'],partners:['Partners & Actors','Performance, ownership and delivery exposure'],resources:['Resources','Budget, expenditure, authorization and variance'],map:['Organizational Map','Live relationships, dependencies and propagation paths'],reports:['Reports','Decision-ready management outputs'],timeline:['Timeline','Chronology of organizational events, decisions and state changes']};
const initial={signals:[
{id:'A07',title:'District integration overdue',severity:'Critical',activity:'A07 · District Integration',impact:'Blocks A03 downstream delivery',days:39,status:'OPEN'},
{id:'FIN-02',title:'Funding authorization unresolved',severity:'Critical',activity:'Finance · Programme',impact:'May constrain Q3 delivery',days:12,status:'OPEN'},
{id:'A03',title:'Verification gap in beneficiary data',severity:'Watch',activity:'A03 · Beneficiary Registration',impact:'Low evidence coverage',days:7,status:'OPEN'}],
activities:[{id:'A01',name:'System Design',progress:100,status:'On track',owner:'MoICT',target:100},{id:'A02',name:'Procurement',progress:85,status:'On track',owner:'MoFPED',target:90},{id:'A03',name:'Beneficiary Registration',progress:67,status:'At risk',owner:'MoICT',target:80},{id:'A07',name:'District Integration',progress:80,status:'Critical',owner:'MoICT',target:100},{id:'A08',name:'Training & Rollout',progress:45,status:'Watch',owner:'MoICT',target:65}],
commitments:[{id:'C01',title:'District-level beneficiary dataset',owner:'MoICT',due:'15 Aug 2026',status:'Overdue'},{id:'C02',title:'Funding authorization decision',owner:'MoFPED',due:'20 Sep 2026',status:'Open'},{id:'C03',title:'Standardize beneficiary definitions',owner:'M&E Secretariat',due:'25 Sep 2026',status:'Open'},{id:'C04',title:'Training completion evidence',owner:'MoICT',due:'30 Sep 2026',status:'On track'}],
evidence:[{title:'Ministry of ICT — Progress Report (Aug 2026)',type:'PDF',status:'Verified',time:'2h ago'},{title:'District Integration Update — Lira',type:'XLSX',status:'Verified',time:'1d ago'},{title:'Budget Revision Request',type:'DOCX',status:'Under review',time:'2d ago'},{title:'Training Attendance — Rollout Phase 1',type:'CSV',status:'Verified',time:'3d ago'}],
resources:[{id:'R01',name:'Programme approved envelope',approved:6000000,spent:4200000,unit:'USD',status:'Within envelope'},{id:'R02',name:'Beta grant expenditure',approved:2000000,spent:2100000,unit:'USD',status:'Reconciliation required'}],
relationships:[{from:'A07',to:'A03',type:'depends_on',status:'critical'},{from:'A01',to:'A08',type:'supports',status:'watch'},{from:'A09',to:'A10',type:'feeds',status:'normal'}],
actions:[],
partners:[{name:'Ministry of ICT',score:81,role:'Programme owner'},{name:'Alpha Implementation',score:76,role:'Delivery partner'},{name:'Beta Enterprise Support',score:64,role:'Grant partner'},{name:'M&E Secretariat',score:89,role:'Verification'}],
events:[{kind:'District integration progress updated',detail:'8/10 districts completed (was 7/10)',time:'1d ago',status:'state'},{kind:'Budget revision requested',detail:'Additional funding for rollout phase',time:'2d ago',status:'state'},{kind:'Commitment deadline extended',detail:'A08 · Training (31 Aug → 30 Sep 2026)',time:'3d ago',status:'state'},{kind:'Beneficiary definitions requested',detail:'M&E Secretariat requested standardization',time:'5d ago',status:'state'}],reviews:[]};
const KEY='uderp_v1_11_state';let state=JSON.parse(localStorage.getItem(KEY)||'null')||initial;
function save(){localStorage.setItem(KEY,JSON.stringify(state));updateCounts()}
function activeSignals(){return state.signals.filter(s=>s.status!=='RESOLVED')}
function counts(){let a=activeSignals();return {active:a.length,critical:a.filter(s=>s.severity==='Critical').length,watch:a.filter(s=>s.severity==='Watch').length,info:a.filter(s=>s.severity==='Info').length,resolved:state.signals.filter(s=>s.status==='RESOLVED').length}}
function updateCounts(){document.getElementById('signalBadge').textContent=counts().active}
function activeCount(){return counts().active}
function actionCount(){return (state.actions||[]).filter(a=>a.status!=='DONE').length}
function addEvent(kind,detail,status='state'){state.events.unshift({kind,detail,time:'just now',status});save()}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function go(kind){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(kind).classList.add('active');document.getElementById('pageTitle').textContent=titles[kind][0];document.getElementById('pageSub').textContent=titles[kind][1];document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===kind));render(kind);updateCounts();window.scrollTo({top:0,behavior:'smooth'})}
function render(k){if(k==='control')document.getElementById(k).innerHTML=control();else if(k==='analytics')document.getElementById(k).innerHTML=analytics();else if(k==='signals')document.getElementById(k).innerHTML=signals();else if(k==='map')document.getElementById(k).innerHTML=map();else if(k==='timeline')document.getElementById(k).innerHTML=timeline();else document.getElementById(k).innerHTML=tablePage(k)}
function kpis(){let c=counts();return `<div class="grid kpis"><div class="card kpi"><div class="label">Programme Health</div><div class="value">72%</div><div class="down small">↓ 6% · At risk</div></div><div class="card kpi"><div class="label">Delivery Progress</div><div class="value">82%</div><div class="up small">↑ 4% · trajectory improving</div></div><div class="card kpi"><div class="label">Financial Position</div><div class="value">$4.2M</div><div class="small muted">70% of $6.0M approved</div></div><div class="card kpi"><div class="label">Commitments</div><div class="value">14</div><div class="down small">3 overdue · 21 total</div></div><div class="card kpi"><div class="label">Evidence Coverage</div><div class="value">87%</div><div class="up small">↑ 12% · verified claims</div></div><div class="card kpi"><div class="label">Active Signals</div><div class="value">${c.active}</div><div class="small"><span class="down">${c.critical} critical</span> · <span class="warn">${c.watch} watch</span> · ${c.resolved} resolved</div></div></div>`}
function control(){let c=counts();return `${kpis()}<div class="grid bodygrid" style="margin-top:12px"><div class="card panel wide"><div class="panelhead"><div><div class="paneltitle">Organizational Pulse</div><div class="muted">The shortest defensible view of the current state.</div></div><span class="pill">${c.active} active signals</span></div><div class="split"><div><div class="insight red"><b>A07 is the dominant pressure point.</b><br><span class="muted">8/10 districts integrated; 39 days overdue; A03 downstream dependency exposed.</span></div><div class="insight"><b>Financial authorization remains unresolved.</b><br><span class="muted">Beta expenditure is above the approved envelope while the additional request lacks approval evidence.</span></div><div class="insight green"><b>Two delivery streams are ahead of trajectory.</b><br><span class="muted">Delta infrastructure and Epsilon women enterprise activity do not require intervention.</span></div></div><div><div class="label">State pressure matrix</div><div class="matrix"><div class="cell red"><span class="muted">Critical</span><b>${c.critical}</b></div><div class="cell amber"><span class="muted">Watch</span><b>${c.watch}</b></div><div class="cell green"><span class="muted">Verified</span><b>87%</b></div><div class="cell"><span class="muted">Exposed links</span><b>${(state.relationships||[]).filter(r=>r.status==='critical').length}</b></div></div><div class="label" style="margin-top:15px">Management attention</div><div class="signal"><i class="sev critical"></i><div><b>Complete remaining district integrations</b><div class="sigmeta">Owner: MoICT · linked to A07</div></div><button class="btn" onclick="openAction('Complete remaining district integrations')">Open</button></div><div class="signal"><i class="sev critical"></i><div><b>Resolve funding authorization</b><div class="sigmeta">Owner: MoFPED · finance exposure</div></div><button class="btn" onclick="openAction('Resolve funding authorization')">Open</button></div></div></div><div class="actions"><button class="btn" onclick="go('map')">Inspect organizational map →</button><button class="btn" onclick="go('timeline')">Review history →</button></div></div><div class="card panel"><div class="panelhead"><div class="paneltitle">Active Signals</div><button class="link" onclick="go('signals')">View all →</button></div>${activeSignals().map(s=>`<div class="signal" onclick="openSignal('${s.id}')"><i class="sev ${s.severity==='Critical'?'critical':'watch'}"></i><div><div class="sigtitle">${esc(s.title)}</div><div class="sigmeta">${esc(s.activity)} · ${esc(s.impact)}</div></div><span class="pill ${s.severity==='Critical'?'red':'amber'}">${s.severity}</span></div>`).join('')||'<div class="empty">No active signals.</div>'}</div><div class="card panel"><div class="panelhead"><div class="paneltitle">Activity State</div><button class="link" onclick="go('activities')">All →</button></div>${state.activities.map(a=>`<div class="barrow"><span>${a.id} · ${a.name}</span><div class="track"><div class="fill ${a.progress<60?'red':a.progress<a.target?'amber':''}" style="width:${a.progress}%"></div></div><b>${a.progress}%</b></div>`).join('')}</div><div class="card panel wide"><div class="panelhead"><div class="paneltitle">What Changed?</div><button class="link" onclick="go('timeline')">Open timeline →</button></div>${state.events.slice(0,5).map(e=>`<div class="signal"><i class="sev info"></i><div><b>${esc(e.kind)}</b><div class="sigmeta">${esc(e.detail)}</div></div><span class="muted">${esc(e.time)}</span></div>`).join('')}</div><div class="card panel"><div class="panelhead"><div class="paneltitle">Evidence Posture</div><button class="link" onclick="go('evidence')">Vault →</button></div><div class="value">87%</div><div class="muted">verified claims</div><div class="barrow"><span>Verified</span><div class="track"><div class="fill" style="width:87%"></div></div><b>87%</b></div><div class="barrow"><span>Under review</span><div class="track"><div class="fill amber" style="width:8%"></div></div><b>8%</b></div><div class="barrow"><span>Rejected / gap</span><div class="track"><div class="fill red" style="width:5%"></div></div><b>5%</b></div></div></div>`}
function chartSvg(){return `<div class="chartbox"><svg viewBox="0 0 760 245" preserveAspectRatio="none"><g stroke="#18304f" stroke-width="1">${[35,75,115,155,195,235].map(y=>`<line x1="45" y1="${y}" x2="742" y2="${y}"/>`).join('')}</g><polyline fill="none" stroke="#5b9cff" stroke-width="3" points="45,205 105,190 165,177 225,160 285,138 345,130 405,115 465,96 525,76 585,58 645,43 705,34"/><polyline fill="none" stroke="#45d49a" stroke-width="3" points="45,212 105,198 165,188 225,176 285,160 345,159 405,145 465,126 525,107 585,87 645,77 705,70"/><polyline fill="none" stroke="#9b82ff" stroke-width="2" stroke-dasharray="7 7" points="585,87 645,66 705,50 742,39"/>${[45,105,165,225,285,345,405,465,525,585,645,705].map((x,i)=>`<circle cx="${x}" cy="${[212,198,188,176,160,159,145,126,107,87,77,70][i]}" r="3.5" fill="#45d49a"/>`).join('')}<text x="705" y="28" fill="#8ea2c0" font-size="10">Forecast</text></svg></div><div class="legend"><span>Planned</span><span class="actual">Actual</span><span class="forecast">Forecast</span></div>`}
function analytics(){let acts=state.activities,avg=Math.round(acts.reduce((n,a)=>n+a.progress,0)/acts.length),target=Math.round(acts.reduce((n,a)=>n+a.target,0)/acts.length),atRisk=acts.filter(a=>a.status!=='On track').length,variance=avg-target;return `<div class="grid statgrid" style="grid-template-columns:repeat(5,1fr)"><div class="card kpi"><div class="label">Observed Delivery</div><div class="value">${avg}%</div><div class="small ${variance>=0?'up':'down'}">${variance>=0?'+':''}${variance} pts vs activity targets</div></div><div class="card kpi"><div class="label">Schedule Exposure</div><div class="value down">${counts().critical}</div><div class="small">critical signals</div></div><div class="card kpi"><div class="label">Budget Position</div><div class="value">70%</div><div class="small up">$4.2M of $6.0M spent</div></div><div class="card kpi"><div class="label">Forecast Basis</div><div class="value">Current</div><div class="small">derived from observed activity state</div></div><div class="card kpi"><div class="label">At-risk Activities</div><div class="value warn">${atRisk}</div><div class="small">require monitoring or action</div></div></div><div class="grid bodygrid" style="margin-top:12px"><div class="card panel wide"><div class="panelhead"><div><div class="paneltitle">Delivery Analysis</div><div class="muted">Observed activity performance against current targets; forecasting should remain evidence-bounded.</div></div><span class="pill green">State-derived</span></div>${activityChart()}</div><div class="card panel"><div class="panelhead"><div class="paneltitle">Variance by Activity</div></div>${acts.map(a=>{let d=a.progress-a.target;return `<div class="barrow"><span>${a.id}</span><div class="track"><div class="fill ${d<0?'amber':''}" style="width:${Math.min(100,Math.max(0,a.progress))}%"></div></div><b>${d>=0?'+':''}${d}</b></div>`}).join('')}</div><div class="card panel"><div class="panelhead"><div class="paneltitle">Resource Variance</div></div>${state.resources.map(r=>{let pct=Math.round(r.spent/r.approved*100);return `<div class="insight ${pct>100?'red':''}"><b>${esc(r.name)}</b><br><span class="muted">${r.unit} ${fmtMoney(r.spent)} spent of ${fmtMoney(r.approved)} approved · ${pct}%</span></div>`}).join('')}</div><div class="card panel wide"><div class="panelhead"><div class="paneltitle">Scenario Analysis</div><button class="btn" onclick="scenario()">Run scenario</button></div><div class="grid scenario"><div class="card"><div class="label">Current state</div><div class="value">${avg}%</div><div class="up small">Observed</div></div><div class="card"><div class="label">+10% velocity</div><div class="value">${Math.min(100,Math.round(avg*1.1))}%</div><div class="up small">Illustrative sensitivity</div></div><div class="card"><div class="label">-15% velocity</div><div class="value">${Math.max(0,Math.round(avg*.85))}%</div><div class="down small">Illustrative sensitivity</div></div></div></div><div class="card panel"><div class="panelhead"><div class="paneltitle">Analytical Boundary</div></div><div class="insight">Forecasts are presented as scenarios until sufficient historical observations exist to support a statistical forecast.</div><div class="insight red">A07 is a dependency constraint, not proof of downstream failure.</div></div></div>`}
function fmtMoney(n){return '$'+(n/1000000).toFixed(1)+'M'}
function activityChart(){let a=state.activities;return `<div class="chartbox"><svg viewBox="0 0 760 245" preserveAspectRatio="none"><g stroke="#18304f" stroke-width="1">${[35,75,115,155,195,235].map(y=>`<line x1="45" y1="${y}" x2="742" y2="${y}"/>`).join('')}</g>${a.map((x,i)=>{let bx=70+i*135;let h=x.progress*1.75;let th=x.target*1.75;return `<rect x="${bx}" y="${235-th}" width="42" height="${th}" fill="#294a73"/><rect x="${bx+48}" y="${235-h}" width="42" height="${h}" fill="#45d49a"/><text x="${bx+20}" y="242" fill="#8ea2c0" font-size="9">${x.id}</text>`}).join('')}</svg></div><div class="legend"><span>Target</span><span class="actual">Observed</span></div>`}
function signals(){let c=counts();return `<div class="card panel"><div class="panelhead"><div><div class="paneltitle">Ranked Signals</div><div class="muted" style="margin-top:4px"><b>${c.active} active</b> · ${c.critical} critical · ${c.watch} watch · ${c.info} info · ${c.resolved} resolved</div></div><div class="actions" style="margin:0"><button class="btn" onclick="toast('High-value filter applied')">High value only</button><button class="btn" onclick="toast('Signals recomputed from current state')">Recompute</button></div></div>${activeSignals().map(s=>`<div class="signal" style="grid-template-columns:9px 1fr auto auto" onclick="openSignal('${s.id}')"><i class="sev ${s.severity==='Critical'?'critical':'watch'}"></i><div><div class="sigtitle">${esc(s.title)}</div><div class="sigmeta">${esc(s.activity)} · ${esc(s.impact)}</div></div><span class="pill ${s.severity==='Critical'?'red':'amber'}">${s.severity}</span><button class="btn" onclick="event.stopPropagation();openSignal('${s.id}')">Trace reasoning</button></div>`).join('')||'<div class="empty">No active signals. Resolved signals remain available in Timeline.</div>'}</div><div class="card panel" style="margin-top:12px"><div class="panelhead"><div class="paneltitle">Resolution state</div><button class="link" onclick="go('timeline')">Review ledger →</button></div><div class="detailgrid"><div class="detail">Active<b>${c.active}</b></div><div class="detail">Critical<b>${c.critical}</b></div><div class="detail">Watch<b>${c.watch}</b></div><div class="detail">Resolved<b>${c.resolved}</b></div></div></div>`}
function map(){let rel=state.relationships||[];return `<div class="card panel"><div class="panelhead"><div><div class="paneltitle">Organizational Dependency Map</div><div class="muted">Relationships are derived from the organizational model; selecting a node traces connected state.</div></div><div class="actions" style="margin:0"><button class="btn" onclick="toast('Dependency layer active')">Dependencies</button><button class="btn" onclick="toast('Relationship layer active')">Relationships</button><button class="btn" onclick="toast('Flow layer active')">Flow</button></div></div><div class="map"><svg viewBox="0 0 1000 520"><line x1="500" y1="250" x2="250" y2="120" stroke="#a84450" stroke-width="3"/><line x1="500" y1="250" x2="760" y2="125" stroke="#6e5a2a" stroke-width="2"/><line x1="500" y1="250" x2="250" y2="380" stroke="#2c6280" stroke-width="2"/><line x1="500" y1="250" x2="760" y2="380" stroke="#2c6280" stroke-width="2"/></svg><div class="node red" style="left:50%;top:48%" onclick="openActivity('A07')"><strong>A07 · District Integration</strong><small>Critical · overdue</small></div><div class="node red" style="left:25%;top:23%" onclick="openActivity('A03')"><strong>A03 · Beneficiary Registration</strong><small>Downstream exposure</small></div><div class="node amber" style="left:76%;top:24%"><strong>A08 · Training</strong><small>Supports rollout</small></div><div class="node green" style="left:25%;top:73%" onclick="openActivity('A02')"><strong>A02 · Procurement</strong><small>On track</small></div><div class="node" style="left:76%;top:73%"><strong>A09 → A10</strong><small>Monitoring feeds evaluation</small></div><div class="node" style="left:50%;top:15%"><strong>MoICT</strong><small>Programme owner</small></div><div class="maplegend"><span><i class="dot" style="background:var(--red)"></i>Critical dependency</span><span><i class="dot" style="background:var(--amber)"></i>Watch</span><span><i class="dot" style="background:var(--green)"></i>On track</span></div></div><div style="margin-top:12px">${rel.map(r=>`<div class="signal"><i class="sev ${r.status==='critical'?'critical':r.status==='watch'?'watch':'info'}"></i><div><b>${r.from} → ${r.to}</b><div class="sigmeta">${r.type}</div></div><span class="pill">${r.status}</span></div>`).join('')}</div></div>`}
function timeline(){return `<div class="grid bodygrid"><div class="card panel wide"><div class="panelhead"><div><div class="paneltitle">Organizational History</div><div class="muted">State changes, reviews, decisions and resolutions are preserved.</div></div><span class="pill">${state.events.length+state.reviews.length+(state.actions||[]).length} records</span></div><div class="timeline">${[...state.reviews.map(r=>({kind:r.type,detail:r.note,time:r.time,status:r.type==='Resolved'?'resolved':'state'})),...state.events].slice(0,30).map(e=>`<div class="event ${e.status==='resolved'?'resolved':''}"><b>${esc(e.kind)}</b><div>${esc(e.detail)}</div><small>${esc(e.time)}</small></div>`).join('')}</div></div><div class="card panel"><div class="panelhead"><div class="paneltitle">Review & Resolution Ledger</div></div>${state.reviews.length?state.reviews.slice(0,12).map(r=>`<div class="signal"><i class="sev ${r.type==='Resolved'?'critical':'info'}"></i><div><b>${esc(r.type)}</b><div class="sigmeta">${esc(r.entityId)} · ${esc(r.by)} · ${esc(r.time)}</div><div style="margin-top:4px" class="muted">${esc(r.note)}</div></div></div>`).join(''):'<div class="empty">No reviews or resolutions recorded yet.</div>'}<div class="label" style="margin-top:16px">Management actions</div>${(state.actions||[]).length?(state.actions||[]).slice(0,10).map(a=>`<div class="signal"><i class="sev info"></i><div><b>${esc(a.name)}</b><div class="sigmeta">${esc(a.id)} · ${esc(a.owner)} · ${esc(a.status)}</div></div></div>`).join(''):'<div class="empty">No actions created yet.</div>'}</div></div>`}
function tablePage(k){let data=state[k]||[];if(k==='programmes')data=[{name:'Digital Public Services Programme',health:'72%',status:'At risk',signals:counts().active},{name:'Agriculture & Livelihoods',health:'84%',status:'On track',signals:1},{name:'Infrastructure Resilience',health:'79%',status:'On track',signals:2}];let labels={programmes:['Programme','Health','Status','Signals'],activities:['ID · Activity','Progress','Status','Owner'],commitments:['ID · Commitment','Owner','Due','Status'],evidence:['Evidence source','Type','Status','Received'],partners:['Partner','Performance','Role','Exposure'],resources:['Resource','Value','Position','Evidence']};let h=labels[k]||['Item','Status','Owner',''];return `<div class="card panel"><div class="panelhead"><div><div class="paneltitle">${titles[k][0]}</div><div class="muted">Structured operational records linked to organizational state.</div></div><button class="btn" onclick="toast('View refreshed from current state')">Refresh</button></div><table class="table"><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${data.map((x,i)=>k==='activities'?`<tr onclick="openActivity('${x.id}')"><td><b>${x.id}</b> · ${x.name}</td><td>${x.progress}%</td><td><span class="pill ${x.status==='Critical'?'red':x.status==='Watch'?'amber':'green'}">${x.status}</span></td><td>${x.owner}</td></tr>`:k==='commitments'?`<tr onclick="openCommitment('${x.id}')"><td><b>${x.id}</b> · ${x.title}</td><td>${x.owner}</td><td>${x.due}</td><td><span class="pill ${x.status==='Overdue'?'red':x.status==='On track'?'green':'amber'}">${x.status}</span></td></tr>`:k==='evidence'?`<tr onclick="openEvidence(${i})"><td><b>${x.title}</b></td><td>${x.type}</td><td><span class="pill ${x.status==='Verified'?'green': 'amber'}">${x.status}</span></td><td>${x.time}</td></tr>`:k==='partners'?`<tr><td><b>${x.name}</b></td><td>${x.score}%</td><td>${x.role}</td><td>${x.score<70?'At risk':'Normal'}</td></tr>`:k==='resources'?state.resources.map(r=>`<tr><td><b>${r.name}</b></td><td>${fmtMoney(r.approved)}</td><td>${fmtMoney(r.spent)} spent</td><td><span class="pill ${r.spent>r.approved?'red':'green'}">${r.status}</span></td></tr>`).join(''):`<tr><td><b>${x.name}</b></td><td>${x.health}</td><td><span class="pill ${x.status==='At risk'?'amber':'green'}">${x.status}</span></td><td>${x.signals}</td></tr>`).join('')}</tbody></table></div>`}
function openSignal(id){let s=state.signals.find(x=>x.id===id);if(!s)return;let hist=state.reviews.filter(r=>r.entityId===id);modal(`<div class="modalhead"><div><div class="label">Signal ${s.id}</div><h2 style="margin:5px 0 8px">${esc(s.title)}</h2><span class="pill ${s.severity==='Critical'?'red':'amber'}">${s.severity}</span></div><button class="close" onclick="closeModal()">×</button></div><div class="detailgrid"><div class="detail">State<b>${s.status}</b></div><div class="detail">Exposure<b>${s.days} days</b></div><div class="detail">Activity<b>${esc(s.activity)}</b></div><div class="detail">Confidence<b>High</b></div></div><p><b>Reasoning chain</b><br>${esc(s.impact)}. The signal is derived from reconciled facts, temporal rules and dependency relationships; it is not an accusation.</p><div class="detail"><div class="label">Evidence chain</div><p style="margin-bottom:0">Source report → 8/10 districts integrated → revised deadline 31 Jul → A03 dependency → overdue state.</p></div><div class="detail" style="margin-top:10px"><div class="label">Signal history</div>${hist.length?hist.map(r=>`<div class="signal"><i class="sev info"></i><div><b>${esc(r.type)}</b><div class="sigmeta">${esc(r.by)} · ${esc(r.time)}</div><div class="muted" style="margin-top:4px">${esc(r.note)}</div></div></div>`).join(''):'<div class="muted" style="margin-top:8px">No review history recorded.</div>'}</div><div class="actions"><button class="btn" onclick="ack('${s.id}')">Record review</button><button class="btn" onclick="openAction('Resolve: ${esc(s.title)}')">Assign action</button>${s.status!=='RESOLVED'?`<button class="btn good" onclick="resolve('${s.id}')">Resolve</button>`:'<span class="pill green">Resolved</span>'}</div>`)}
function ack(id){let s=state.signals.find(x=>x.id===id);modal(`<div class="modalhead"><div><div class="label">Review record</div><h2 style="margin:5px 0">Review ${id}</h2></div><button class="close" onclick="closeModal()">×</button></div><textarea id="note" style="width:100%;min-height:110px;background:#081427;border:1px solid #29466f;border-radius:8px;color:#e8eef8;padding:10px" placeholder="What was reviewed, validated or decided?"></textarea><div class="actions"><button class="btn good" onclick="saveReview('${id}')">Save review</button></div>`)}
function saveReview(id){let note=(document.getElementById('note')?.value||'').trim();if(!note){toast('A review note is required');return}let t=new Date().toLocaleString([],{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});state.reviews.unshift({entityId:id,type:'Reviewed',note,by:'Programme Manager',time:t});state.events.unshift({kind:'Signal reviewed',detail:`${id} · ${note}`,time:'just now',status:'state'});save();closeModal();toast('Review recorded in organizational history');go('timeline')}
function resolve(id){let s=state.signals.find(x=>x.id===id);modal(`<div class="modalhead"><div><div class="label">Resolution record</div><h2 style="margin:5px 0">Resolve ${id} — ${esc(s.title)}</h2></div><button class="close" onclick="closeModal()">×</button></div><p class="muted">Resolution requires a basis so the system preserves why the signal left the active state.</p><textarea id="note" style="width:100%;min-height:110px;background:#081427;border:1px solid #29466f;border-radius:8px;color:#e8eef8;padding:10px" placeholder="What changed, and what evidence supports closure?"></textarea><div class="actions"><button class="btn good" onclick="saveResolution('${id}')">Confirm resolution</button></div>`)}
function saveResolution(id){let note=(document.getElementById('note')?.value||'').trim();if(!note){toast('A resolution basis is required');return}let s=state.signals.find(x=>x.id===id);s.status='RESOLVED';let t=new Date().toLocaleString([],{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});state.reviews.unshift({entityId:id,type:'Resolved',note,by:'Programme Manager',time:t});state.events.unshift({kind:'Signal resolved',detail:`${id} · ${s.title} — ${note}`,time:'just now',status:'resolved'});save();closeModal();toast(`${id} resolved; active signal count updated`);go('control')}
function openActivity(id){let a=state.activities.find(x=>x.id===id);modal(`<div class="modalhead"><div><div class="label">Activity ${id}</div><h2 style="margin:5px 0">${esc(a.name)}</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="detailgrid"><div class="detail">Progress<b>${a.progress}%</b></div><div class="detail">Target<b>${a.target}%</b></div><div class="detail">Status<b>${a.status}</b></div><div class="detail">Owner<b>${a.owner}</b></div></div><p>Operational state is evaluated against target, timing and related dependencies.</p><div class="actions"><button class="btn good" onclick="recordActivityReview('${id}')">Record review</button><button class="btn" onclick="go('map');closeModal()">Inspect dependencies</button></div>`)}
function recordActivityReview(id){let a=state.activities.find(x=>x.id===id);modal(`<div class="modalhead"><div><div class="label">Activity review</div><h2 style="margin:5px 0">${id} — ${esc(a.name)}</h2></div><button class="close" onclick="closeModal()">×</button></div><textarea id="note" style="width:100%;min-height:110px;background:#081427;border:1px solid #29466f;border-radius:8px;color:#e8eef8;padding:10px" placeholder="What was reviewed, validated or decided?"></textarea><div class="actions"><button class="btn good" onclick="saveActivityReview('${id}')">Save review</button></div>`)}
function saveActivityReview(id){let note=(document.getElementById('note')?.value||'').trim();if(!note){toast('A review note is required');return}let a=state.activities.find(x=>x.id===id),t=new Date().toLocaleString([],{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});state.reviews.unshift({entityId:id,type:'Reviewed',note,by:'Programme Manager',time:t});state.events.unshift({kind:'Activity reviewed',detail:`${id} · ${a.name} — ${note}`,time:'just now',status:'state'});save();closeModal();toast('Activity review recorded');go('timeline')}
function openCommitment(id){let c=state.commitments.find(x=>x.id===id);modal(`<div class="modalhead"><div><div class="label">Commitment ${id}</div><h2 style="margin:5px 0">${esc(c.title)}</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="detailgrid"><div class="detail">Owner<b>${c.owner}</b></div><div class="detail">Due<b>${c.due}</b></div><div class="detail">Status<b>${c.status}</b></div><div class="detail">Evidence<b>${c.status==='Overdue'?'Missing':'Present / expected'}</b></div></div><p>A commitment remains open until completion evidence is present.</p><div class="actions"><button class="btn" onclick="upload()">Attach evidence</button><button class="btn good" onclick="openAction('Follow up: ${esc(c.title)}')">Assign follow-up</button></div>`)}
function openEvidence(i){let e=state.evidence[i];modal(`<div class="modalhead"><div><div class="label">Evidence source</div><h2 style="margin:5px 0">${esc(e.title)}</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="detailgrid"><div class="detail">Format<b>${e.type}</b></div><div class="detail">Status<b>${e.status}</b></div><div class="detail">Received<b>${e.time}</b></div><div class="detail">Provenance<b>Preserved</b></div></div><p>Evidence supports facts and signals while retaining source provenance. It does not directly overwrite organizational truth.</p>`)}
function openAction(name){modal(`<div class="modalhead"><div><div class="label">Management action</div><h2 style="margin:5px 0">${esc(name)}</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="detailgrid"><div class="detail">Owner<b>Programme Manager</b></div><div class="detail">Priority<b>High</b></div><div class="detail">Status<b>Open</b></div><div class="detail">Evidence<b>Required</b></div></div><div class="actions"><button class="btn good" onclick="saveAction('${esc(name)}')">Create action</button></div>`)}
function saveAction(name){let id='ACT-'+String((state.actions||[]).length+1).padStart(3,'0');state.actions.push({id,name,owner:'Programme Manager',priority:'High',status:'OPEN',created:'just now'});state.events.unshift({kind:'Action created',detail:`${id} · ${name}`,time:'just now',status:'state'});save();closeModal();toast(`${id} created and added to Actions`);go('timeline')}
function scenario(){modal(`<div class="modalhead"><div><div class="label">Scenario analysis</div><h2 style="margin:5px 0">Adjust delivery velocity</h2></div><button class="close" onclick="closeModal()">×</button></div><p class="muted">Illustrative sensitivity model using current programme state.</p><label>Velocity adjustment: <b id="vel">0%</b></label><input class="range" type="range" min="-20" max="20" value="0" oninput="vel.textContent=this.value+'%';result.textContent=Math.max(45,Math.min(98,82+Number(this.value)*.8)).toFixed(0)+'% projected completion'"><div class="detail" style="margin-top:16px"><div class="label">Projected outcome</div><b id="result">82% projected completion</b></div><div class="actions"><button class="btn good" onclick="closeModal();toast('Scenario saved')">Save scenario</button></div>`)}
function compare(){modal(`<div class="modalhead"><div><div class="label">Comparative view</div><h2 style="margin:5px 0">Programme comparison</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="detailgrid"><div class="detail">DPSP Health<b>72%</b></div><div class="detail">Agriculture<b>84%</b></div><div class="detail">Infrastructure<b>79%</b></div><div class="detail">Evidence<b>87%</b></div></div><p>Comparisons preserve each programme's definitions, periods and evidence boundaries.</p>`)}
function upload(){modal(`<div class="modalhead"><div><div class="label">Evidence ingestion</div><h2 style="margin:5px 0">Add organizational evidence</h2></div><button class="close" onclick="closeModal()">×</button></div><input id="evidenceFile" type="file" accept=".pdf,.docx,.xlsx,.csv,.txt,.md" style="width:100%"><p class="muted">Evidence enters the system first; extraction and fact acceptance remain separate from organizational state.</p><div class="actions"><button class="btn good" onclick="ingestEvidence()">Ingest</button></div>`)}
function ingestEvidence(){let f=document.getElementById('evidenceFile')?.files?.[0];if(!f){toast('Select a source file first');return}state.evidence.unshift({title:f.name,type:(f.name.split('.').pop()||'FILE').toUpperCase(),status:'Under review',time:'just now'});state.events.unshift({kind:'Evidence submitted',detail:`${f.name} · queued for extraction/review`,time:'just now',status:'state'});save();closeModal();toast('Evidence queued; organizational state unchanged until review');go('evidence')}
function modal(x){document.getElementById('modalbox').innerHTML=x;document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}function toast(x){let t=document.getElementById('toast');t.textContent=x;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2300)}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.view));document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};document.getElementById('search').oninput=e=>{if(e.target.value.trim().length>2)toast('Searching organizational state and evidence…')};document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('search').focus()}if(e.key==='Escape')closeModal()});save();render('control');updateCounts();
</script></body></html>
